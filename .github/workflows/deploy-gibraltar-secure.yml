name: Desplegar Gibraltar Watch seguro

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: ["Actualizar Gibraltar Watch"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probar contratos de publicación
        run: python -m unittest -v test_publication.py

      - name: Aplicar presentación editorial profesional
        run: python install_gibraltar_professional.py

      - name: Auditar posibles secretos
        run: python audit_repository_secrets.py

      - name: Limpiar metadatos internos de las salidas públicas
        run: python sanitize_editorial_metadata.py

      - name: Construir artefacto público endurecido
        run: python build_secure_public_site.py

      - name: Auditar artefacto público
        run: |
          python audit_public_artifact.py
          python check_public_links.py _site

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto público
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
