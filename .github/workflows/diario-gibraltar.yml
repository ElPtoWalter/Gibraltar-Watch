name: Diario de Gibraltar

on:
  schedule:
    - cron: "19 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gibraltar-content-writes
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generar Diario y productos diarios
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DIARIO_FREE_AI_MODEL: ${{ vars.DIARIO_FREE_AI_MODEL }}
        run: |
          python generate_diario_estrecho.py
          python update_observatory.py
          python generate_newsletter.py
          python build_publication_manifest.py
          python validate_gibraltar.py
      - name: Guardar edición
        id: commit
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar Diario del Estrecho"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Avisar mediante IndexNow
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: python submit_gibraltar_indexnow.py
      - name: Publicar exactamente una vez
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-gibraltar-secure.yml --ref main
