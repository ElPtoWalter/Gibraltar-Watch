name: Actualizar Gibraltar Watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gibraltar-content-writes
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar lector OPE
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Actualizar fuentes de cambio frecuente
        run: |
          python update_gibraltar.py
          python update_ope.py
          python update_geopolitics.py
          python build_events.py
          python update_observatory.py
      - name: Validar salidas críticas
        run: |
          python audit_repository_secrets.py
          python validate_gibraltar.py
      - name: Guardar cambios del monitor
        id: commit
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Actualizar monitor horario de Gibraltar Watch"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Avisar mediante IndexNow
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: python submit_gibraltar_indexnow.py
      - name: Publicar exactamente una vez
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-gibraltar-secure.yml --ref main
